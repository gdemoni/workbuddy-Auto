name: Daily

on:
  workflow_dispatch:
  schedule:
    # UTC: Beijing 07:00, 12:00, and 23:30
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily task
        env:
          DAILY_BOOTSTRAP_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -s wb_refresh_tokens.json ]; then
            echo "Using the rotated token stored in this private repository"
          else
            if [ -z "$DAILY_BOOTSTRAP_TOKEN" ]; then
              echo "Missing WORKBUDDY_REFRESH_TOKEN repository secret"
              exit 1
            fi
            export WORKBUDDY_REFRESH_TOKEN="$DAILY_BOOTSTRAP_TOKEN"
            echo "Initializing token state from repository secret"
          fi
          python daily.py --no-desktop

      - name: Persist rotated token
        if: success()
        run: |
          if [ ! -s wb_refresh_tokens.json ]; then
            echo "Token state file was not created"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wb_refresh_tokens.json
          if git diff --cached --quiet; then
            echo "Token state is unchanged"
          else
            git commit -m "chore: update token state [skip ci]"
            git push
          fi
